<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="6" flood-opacity="0.10"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16A34A"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DC2626"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- ═══════ COL 1: WEB APP — x=180 ═══════ -->
  <g transform="translate(180,420)" filter="url(#shadow)">
    <rect x="-95" y="-120" width="190" height="135" rx="12" fill="#2563EB"/>
    <rect x="-78" y="-102" width="156" height="95" rx="5" fill="#1E40AF"/>
    <line x1="-52" y1="-80" x2="52" y2="-80" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <line x1="-52" y1="-58" x2="30" y2="-58" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
    <line x1="-52" y1="-36" x2="42" y2="-36" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
    <rect x="-18" y="15" width="36" height="15" rx="3" fill="#2563EB"/>
    <rect x="-38" y="30" width="76" height="8" rx="4" fill="#2563EB"/>
  </g>
  <text x="180" y="510" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Web App</text>
  <text x="180" y="538" text-anchor="middle" font-size="15" fill="#64748B">React · CQRS Router</text>

  <!-- Persona badges -->
  <g transform="translate(180,600)">
    <rect x="-125" y="0" width="250" height="82" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="0" y="25" text-anchor="middle" font-size="14" font-weight="600" fill="#2563EB">5 Personas</text>
    <text x="0" y="48" text-anchor="middle" font-size="12" fill="#64748B">Filer · Pro · Manager · Exec · DevOps</text>
    <text x="0" y="68" text-anchor="middle" font-size="12" fill="#64748B">/ai-assistant · /ai-ask · /search-cases</text>
  </g>

  <!-- ═══════ COL 2: DAB — x=500 ═══════ -->
  <g transform="translate(500,420)" filter="url(#shadow)">
    <polygon points="0,-105 91,-52 91,52 0,105 -91,52 -91,-52" fill="#059669"/>
    <circle cx="0" cy="0" r="44" fill="#047857" stroke="#6EE7B7" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="24" font-weight="700" fill="#FFF">API</text>
  </g>
  <text x="500" y="555" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A5F">Data API Builder</text>
  <text x="500" y="582" text-anchor="middle" font-size="15" fill="#64748B">REST + GraphQL</text>

  <!-- Data source indicators -->
  <g transform="translate(500,630)">
    <rect x="-105" y="0" width="210" height="68" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <circle cx="-75" cy="22" r="8" fill="#FDE047"/>
    <text x="-58" y="27" font-size="13" font-weight="600" fill="#065F46">Primary (R/W)</text>
    <circle cx="-75" cy="48" r="8" fill="#F59E0B"/>
    <text x="-58" y="53" font-size="13" font-weight="600" fill="#065F46">Read-Only</text>
  </g>

  <!-- ═══════ COL 3: HYPERSCALE — x=740..1260 ═══════ -->
  <rect x="740" y="140" width="520" height="800" rx="24" fill="none" stroke="#7C3AED" stroke-width="3.5" stroke-dasharray="16 8"/>
  <text x="1000" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#7C3AED">Azure SQL DB Hyperscale</text>

  <!-- Primary cylinder at x=880 -->
  <g transform="translate(880,420)">
    <ellipse cx="0" cy="-80" rx="82" ry="26" fill="#9333EA" filter="url(#shadow)"/>
    <rect x="-82" y="-80" width="164" height="160" fill="#7C3AED"/>
    <ellipse cx="0" cy="80" rx="82" ry="26" fill="#6D28D9"/>
    <line x1="-82" y1="-80" x2="-82" y2="80" stroke="#6D28D9" stroke-width="1.5"/>
    <line x1="82" y1="-80" x2="82" y2="80" stroke="#6D28D9" stroke-width="1.5"/>
    <text x="0" y="-10" text-anchor="middle" font-size="18" font-weight="600" fill="#FFF">R / W</text>
    <text x="0" y="18" text-anchor="middle" font-size="13" fill="#EDE9FE">VECTOR · DiskANN</text>
  </g>
  <text x="880" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#5B21B6">Primary</text>

  <!-- HA Replica cylinder at x=1120 -->
  <g transform="translate(1120,420)">
    <ellipse cx="0" cy="-80" rx="82" ry="26" fill="#A78BFA" filter="url(#shadow)"/>
    <rect x="-82" y="-80" width="164" height="160" fill="#8B5CF6"/>
    <ellipse cx="0" cy="80" rx="82" ry="26" fill="#7C3AED"/>
    <line x1="-82" y1="-80" x2="-82" y2="80" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="82" y1="-80" x2="82" y2="80" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="0" y="-10" text-anchor="middle" font-size="18" font-weight="600" fill="#FFF">Read</text>
    <text x="0" y="18" text-anchor="middle" font-size="13" fill="#EDE9FE">Zone-Redundant</text>
  </g>
  <text x="1120" y="570" text-anchor="middle" font-size="22" font-weight="700" fill="#5B21B6">HA Replica</text>

  <!-- AI capability label inside Hyperscale -->
  <rect x="810" y="640" width="380" height="55" rx="10" fill="rgba(124,58,237,0.06)" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="1000" y="674" text-anchor="middle" font-size="15" fill="#7C3AED">AI_GENERATE_EMBEDDINGS() · External REST</text>

  <!-- ═══════ COL 4: AZURE OPENAI — x=1410..1880 ═══════ -->
  <rect x="1410" y="140" width="470" height="800" rx="24" fill="none" stroke="#EA580C" stroke-width="3.5" stroke-dasharray="16 8"/>
  <text x="1645" y="200" text-anchor="middle" font-size="20" font-weight="700" fill="#EA580C">Azure OpenAI</text>

  <!-- Embeddings — brain/sparkle icon -->
  <g transform="translate(1540,400)" filter="url(#shadow)">
    <rect x="-85" y="-95" width="170" height="190" rx="16" fill="#EA580C"/>
    <!-- Sparkle icon -->
    <circle cx="0" cy="-30" r="28" fill="#F97316" stroke="#FDBA74" stroke-width="2"/>
    <text x="0" y="-22" text-anchor="middle" font-size="30" fill="#FFF">✦</text>
    <text x="0" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Embeddings</text>
    <text x="0" y="55" text-anchor="middle" font-size="12" fill="#FFF3E0">text-embedding-3-small</text>
    <text x="0" y="75" text-anchor="middle" font-size="12" fill="#FFF3E0">VECTOR(1536)</text>
  </g>
  <text x="1540" y="560" text-anchor="middle" font-size="14" fill="#9A3412">CREATE EXTERNAL MODEL</text>

  <!-- Chat Completions -->
  <g transform="translate(1750,400)" filter="url(#shadow)">
    <rect x="-85" y="-95" width="170" height="190" rx="16" fill="#EA580C"/>
    <!-- Chat bubble icon -->
    <circle cx="0" cy="-30" r="28" fill="#F97316" stroke="#FDBA74" stroke-width="2"/>
    <text x="0" y="-20" text-anchor="middle" font-size="26" fill="#FFF">💬</text>
    <text x="0" y="20" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Chat</text>
    <text x="0" y="42" text-anchor="middle" font-size="16" font-weight="600" fill="#FFF">Completions</text>
    <text x="0" y="68" text-anchor="middle" font-size="12" fill="#FFF3E0">GPT · RAG</text>
  </g>
  <text x="1750" y="560" text-anchor="middle" font-size="14" fill="#9A3412">sp_invoke_external_rest_endpoint</text>

  <!-- Auth badge -->
  <rect x="1510" y="640" width="270" height="42" rx="10" fill="rgba(234,88,12,0.06)" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="1645" y="668" text-anchor="middle" font-size="15" fill="#EA580C">Managed Identity Auth</text>

  <!-- ═══════ ARROWS ═══════ -->
  <!-- Web App → DAB -->
  <line x1="290" y1="410" x2="398" y2="410" stroke="#64748B" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="344" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">REST</text>

  <!-- DAB → Primary (R/W) -->
  <line x1="602" y1="385" x2="787" y2="385" stroke="#16A34A" stroke-width="4" marker-end="url(#arrG)"/>
  <rect x="660" y="362" width="50" height="24" rx="5" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="685" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#16A34A">R/W</text>

  <!-- DAB → HA Replica (Read) -->
  <line x1="602" y1="455" x2="670" y2="455" stroke="#F59E0B" stroke-width="4"/>
  <line x1="670" y1="455" x2="670" y2="750" stroke="#F59E0B" stroke-width="4"/>
  <line x1="670" y1="750" x2="1120" y2="750" stroke="#F59E0B" stroke-width="4"/>
  <line x1="1120" y1="750" x2="1120" y2="525" stroke="#F59E0B" stroke-width="4" marker-end="url(#arrA)"/>
  <rect x="845" y="728" width="85" height="24" rx="5" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.5"/>
  <text x="888" y="746" text-anchor="middle" font-size="13" font-weight="700" fill="#D97706">Read-Only</text>

  <!-- Hyperscale → OpenAI (bounding box to bounding box) -->
  <line x1="1260" y1="430" x2="1405" y2="430" stroke="#DC2626" stroke-width="4.5" marker-end="url(#arrR)"/>
  <rect x="1298" y="440" width="58" height="38" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
  <text x="1327" y="455" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">External</text>
  <text x="1327" y="469" text-anchor="middle" font-size="10" font-weight="600" fill="#DC2626">REST</text>
</svg>